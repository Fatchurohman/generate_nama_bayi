<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumpulan Nama Baik - Royal Emerald & Glorious Gold</title>
  <style>
    :root {
      /* Background & Base Colors */
      --bg-gradient: radial-gradient(circle at 50% 0%, #163B2A 0%, #0B1D15 70%, #050E0A 100%);
      --card-bg: rgba(16, 42, 30, 0.85);
      --input-bg: #091711;
      
      /* Gold Elements */
      --gold-primary: #F3C649;
      --gold-dark: #B8860B;
      --gold-light: #FFE89C;
      --gold-gradient: linear-gradient(135deg, #FFF0B3 0%, #F3C649 40%, #B8860B 80%, #7A5800 100%);
      --gold-soft-bg: rgba(243, 198, 73, 0.1);
      
      /* Typography Colors */
      --text-main: #F4F6F0;
      --text-muted: #A3B899;
      --text-gold: #FCE182;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto 30px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(243, 198, 73, 0.3);
      padding-bottom: 15px;
    }

    .app-title h1 {
      font-size: 24px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 10px rgba(243, 198, 73, 0.2);
    }

    .app-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .developer-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(9, 23, 17, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--gold-primary);
      box-shadow: 0 0 12px rgba(243, 198, 73, 0.25);
      font-size: 13px;
      font-weight: 600;
      color: var(--gold-light);
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.8);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }

    .main-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .filter-card {
      background: var(--card-bg);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 15px rgba(243, 198, 73, 0.15);
      margin-bottom: 25px;
      backdrop-filter: blur(10px);
    }

    .filter-group {
      margin-bottom: 18px;
    }

    .filter-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-gold);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    select, input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--gold-dark);
      border-radius: 6px;
      background-color: var(--input-bg);
      color: var(--text-main);
      outline: none;
      font-size: 14px;
    }

    select:focus, input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 8px rgba(243, 198, 73, 0.5);
    }

    .lang-position-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #0B1D15;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(243, 198, 73, 0.3);
    }

    .btn-gold:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(243, 198, 73, 0.5);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
    }

    .btn-outline:hover {
      background: var(--gold-soft-bg);
      box-shadow: 0 0 10px rgba(243, 198, 73, 0.2);
    }

    .results-info {
      margin-bottom: 15px;
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .name-card {
      background: var(--card-bg);
      border: 1px solid rgba(243, 198, 73, 0.4);
      border-radius: 10px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }

    .name-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gold-gradient);
    }

    .name-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-primary);
      box-shadow: 0 6px 20px rgba(243, 198, 73, 0.3);
      background: rgba(22, 59, 42, 0.95);
    }

    .name-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .name-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0B1D15;
      border: 2px solid var(--gold-primary);
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(243, 198, 73, 0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 24px;
      color: var(--gold-light);
      cursor: pointer;
    }

    .modal-title {
      font-size: 22px;
      color: var(--gold-light);
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(243, 198, 73, 0.3);
      padding-bottom: 10px;
      font-weight: 700;
    }

    .word-breakdown {
      margin-bottom: 15px;
    }

    .word-item {
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-main);
    }

    .word-item strong {
      color: var(--gold-primary);
    }

    .full-meaning {
      background: var(--gold-soft-bg);
      padding: 14px;
      border-radius: 6px;
      border-left: 3px solid var(--gold-primary);
      font-size: 14px;
      font-style: italic;
      color: var(--gold-light);
      line-height: 1.5;
    }

    @media print {
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        padding: 0;
      }
      .filter-card, .action-buttons, .developer-badge, .modal-overlay {
        display: none !important;
      }
      .header-container {
        border-bottom: 1px solid #000;
        margin-bottom: 20px;
      }
      .app-title h1 {
        -webkit-text-fill-color: #000 !important;
        color: #000 !important;
      }
      .name-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .name-card {
        background: #FFF !important;
        border: 1px solid #ccc !important;
        break-inside: avoid;
      }
      .name-title {
        color: #000 !important;
      }
      .name-subtitle {
        color: #555 !important;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="app-title">
      <h1>Kumpulan Nama Baik</h1>
      <p>Pilihan Nama Berkah & Indah untuk Sang Buah Hati</p>
    </div>
    <div class="developer-badge">
      <span class="live-dot"></span>
      <span>developer : fatur62</span>
    </div>
  </div>

  <div class="main-container">
    <div class="filter-card">
      <div class="filter-group">
        <label for="wordCount">1. Jumlah Kata (1 - 4 Kata)</label>
        <select id="wordCount" onchange="renderLanguageFilters()">
          <option value="1">1 Kata</option>
          <option value="2" selected>2 Kata</option>
          <option value="3">3 Kata</option>
          <option value="4">4 Kata</option>
        </select>
      </div>

      <div class="filter-group">
        <label>2. Kombinasi Bahasa per Posisi Kata</label>
        <div id="languageFilters" class="lang-position-grid"></div>
      </div>

      <div class="filter-group">
        <label for="limitCount">3. Maksimal Alternatif Ditampilkan (Maks. 1000)</label>
        <input type="number" id="limitCount" min="1" max="1000" value="50">
      </div>

      <div class="action-buttons">
        <button class="btn btn-gold" onclick="applyFilters()">Tampilkan Nama</button>
        <button class="btn btn-outline" onclick="window.print()">Cetak / Simpan PDF</button>
      </div>
    </div>

    <div class="results-info">
      <span id="resultCountText">Menampilkan 0 alternatif nama</span>
    </div>

    <div id="nameGrid" class="name-grid"></div>
  </div>

  <!-- Modal Detail Makna -->
  <div id="detailModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-title" id="modalName">Nama Lengkap</div>
      <div class="word-breakdown" id="modalBreakdown"></div>
      <div class="full-meaning" id="modalMeaning">Makna dan Doa...</div>
    </div>
  </div>

  <script>
    const vocabRepository = {
      Arab: [
        { text: "Muhammad", meaning: "Yang terpuji" },
        { text: "Rayyan", meaning: "Pintu surga bagi orang berpuasa" },
        { text: "Faris", meaning: "Ksatria, pandai" },
        { text: "Zayn", meaning: "Perhiasan, ketampanan" },
        { text: "Hasan", meaning: "Baik, tampan" },
        { text: "Nur", meaning: "Cahaya" },
        { text: "Rahmah", meaning: "Kasih sayang" },
        { text: "Ahmad", meaning: "Sangat terpuji" },
        { text: "Khafi", meaning: "Yang tersembunyi/lembut" },
        { text: "Syakir", meaning: "Orang yang bersyukur" }
      ],
      Inggris: [
        { text: "Arthur", meaning: "Bangsawan yang kuat" },
        { text: "Edward", meaning: "Pelindung kekayaan" },
        { text: "Oliver", meaning: "Pohon zaitun, kedamaian" },
        { text: "Alfred", meaning: "Penasihat yang bijaksana" },
        { text: "William", meaning: "Pelindung yang gigih" }
      ],
      Italia: [
        { text: "Matteo", meaning: "Hadiah dari Tuhan" },
        { text: "Amara", meaning: "Abadi, anggun" },
        { text: "Leonardo", meaning: "Singa yang pemberani" },
        { text: "Romeo", meaning: "Pengembara yang setia" },
        { text: "Gioia", meaning: "Kebahagiaan" }
      ],
      Yunani: [
        { text: "Alexander", meaning: "Pelindung manusia" },
        { text: "Callysta", meaning: "Sangat cantik" },
        { text: "Helena", meaning: "Cahaya terang" },
        { text: "Theodore", meaning: "Karunia dari Tuhan" },
        { text: "Nicholas", meaning: "Kemenangan rakyat" }
      ],
      Indonesia: [
        { text: "Kirana", meaning: "Sinar keindahan" },
        { text: "Bintang", meaning: "Benda langit yang bersinar" },
        { text: "Banyu", meaning: "Air kehidupan" },
        { text: "Cahaya", meaning: "Sinar terang" },
        { text: "Arka", meaning: "Matahari yang menerangi" }
      ],
      Prancis: [
        { text: "Lucien", meaning: "Cahaya terang" },
        { text: "Beau", meaning: "Tampan dan menawan" },
        { text: "Adele", meaning: "Mulia dan baik hati" },
        { text: "Aimée", meaning: "Yang dicintai" },
        { text: "Céleste", meaning: "Surga atau surgawi" }
      ]
    };

    const availableLanguages = ["Semua", "Arab", "Inggris", "Italia", "Yunani", "Indonesia", "Prancis"];

    function renderLanguageFilters() {
      const count = parseInt(document.getElementById('wordCount').value, 10);
      const container = document.getElementById('languageFilters');
      container.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        const div = document.createElement('div');
        div.innerHTML = `
          <span style="font-size:12px; color: var(--text-muted);">Kata ke-${i}:</span>
          <select id="langPos_${i}">
            ${availableLanguages.map(lang => `<option value="${lang}">${lang}</option>`).join('')}
          </select>
        `;
        container.appendChild(div);
      }
    }

    function generateNamesFromVocab(targetWordCount, selectedLangs, limitCount) {
      const generatedResults = [];
      const selectableLanguages = ["Arab", "Inggris", "Italia", "Yunani", "Indonesia", "Prancis"];

      function getWordsForPos(posIndex) {
        const langChoice = selectedLangs[posIndex];
        if (langChoice !== "Semua" && vocabRepository[langChoice]) {
          return vocabRepository[langChoice].map(item => ({ ...item, lang: langChoice }));
        }
        
        let pooled = [];
        selectableLanguages.forEach(lang => {
          if (vocabRepository[lang]) {
            pooled = pooled.concat(vocabRepository[lang].map(item => ({ ...item, lang: lang })));
          }
        });
        return pooled;
      }

      const wordsPerPos = [];
      for (let i = 0; i < targetWordCount; i++) {
        wordsPerPos.push(getWordsForPos(i));
      }

      const maxIterations = Math.min(limitCount * 10, 2000);
      let attempts = 0;

      while (generatedResults.length < limitCount && attempts < maxIterations) {
        attempts++;
        const currentCombo = [];
        const usedWordsInCombo = new Set();
        let isValidCombination = true;

        for (let i = 0; i < targetWordCount; i++) {
          const pool = wordsPerPos[i];
          if (!pool || pool.length === 0) {
            isValidCombination = false;
            break;
          }

          // Filter kata yang belum pernah dipakai dalam satu rangkaian kombinasi ini
          const availableInPool = pool.filter(item => !usedWordsInCombo.has(item.text.toLowerCase()));

          if (availableInPool.length === 0) {
            isValidCombination = false;
            break;
          }

          const randomWord = availableInPool[Math.floor(Math.random() * availableInPool.length)];
          currentCombo.push(randomWord);
          usedWordsInCombo.add(randomWord.text.toLowerCase());
        }

        if (isValidCombination && currentCombo.length === targetWordCount) {
          const fullName = currentCombo.map(w => w.text).join(' ');
          
          if (!generatedResults.some(r => r.fullName.toLowerCase() === fullName.toLowerCase())) {
            const meaningsStr = currentCombo.map(w => w.meaning.toLowerCase()).join(', ');
            generatedResults.push({
              id: Date.now() + Math.random(),
              fullName: fullName,
              wordsCount: targetWordCount,
              words: currentCombo,
              fullMeaning: `Sosok yang membawakan harapan (${meaningsStr}), menjadi doa kebaikan bagi kehidupannya.`
            });
          }
        }
      }

      return generatedResults;
    }

    function applyFilters() {
      try {
        const targetWordCount = parseInt(document.getElementById('wordCount').value, 10);
        const limitCount = parseInt(document.getElementById('limitCount').value, 10) || 50;
        
        const selectedLangs = [];
        for (let i = 1; i <= targetWordCount; i++) {
          const select = document.getElementById(`langPos_${i}`);
          selectedLangs.push(select ? select.value : "Semua");
        }

        const generatedData = generateNamesFromVocab(targetWordCount, selectedLangs, limitCount);
        renderResults(generatedData);
      } catch (err) {
        console.error("Gagal memproses pembuatan nama:", err);
      }
    }

    function renderResults(data) {
      const grid = document.getElementById('nameGrid');
      const countText = document.getElementById('resultCountText');
      grid.innerHTML = '';

      countText.innerText = `Menampilkan ${data.length} alternatif nama`;

      if (data.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color: var(--text-muted); padding:30px;">Tidak ada kombinasi nama yang cocok dengan filter.</div>`;
        return;
      }

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'name-card';
        card.onclick = () => openModal(item);

        const langsText = (item.words || []).map(w => w.lang).join(' + ');

        card.innerHTML = `
          <div class="name-title">${escapeHtml(item.fullName || '')}</div>
          <div class="name-subtitle">Kombinasi: ${escapeHtml(langsText)}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(item) {
      if (!item) return;

      document.getElementById('modalName').innerText = item.fullName || '';
      
      const breakdownContainer = document.getElementById('modalBreakdown');
      breakdownContainer.innerHTML = '';

      if (Array.isArray(item.words)) {
        item.words.forEach((w, index) => {
          const div = document.createElement('div');
          div.className = 'word-item';
          div.innerHTML = `Kata ${index + 1} (<strong>${escapeHtml(w.lang || '')}</strong>): <em>"${escapeHtml(w.text || '')}"</em> - ${escapeHtml(w.meaning || '')}`;
          breakdownContainer.appendChild(div);
        });
      }

      document.getElementById('modalMeaning').innerText = `Doa & Harapan: "${item.fullMeaning || '-'}"`;
      document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderLanguageFilters();
      applyFilters();
    });
  </script>
</body>
</html>
