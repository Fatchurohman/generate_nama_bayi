<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Nama Bayi - Glorious Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', 'Segoe UI', serif;
        }
        body {
            background: linear-gradient(135deg, #051e12 0%, #0b3b24 50%, #03140c 100%);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #f0f0f0;
        }
        .container {
            background: linear-gradient(180deg, #09331f 0%, #062416 100%);
            width: 100%;
            max-width: 680px;
            padding: 35px;
            border-radius: 16px;
            border: 2px solid #d4af37;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 15px rgba(212, 175, 55, 0.25);
            position: relative;
        }

        /* Header & Identitas Developer */
        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }
        h2 {
            color: #ffd700;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
            font-weight: bold;
            margin-bottom: 8px;
        }
        .developer-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            font-size: 13px;
            color: #d4af37;
            letter-spacing: 0.5px;
        }
        .blinking-dot {
            width: 9px;
            height: 9px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: pulse-glow 1.2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px #00ff66; }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        /* Counter Kunjungan */
        .visit-counter {
            text-align: center;
            margin-bottom: 20px;
            font-size: 13px;
            color: #a3c2b0;
            background: rgba(11, 59, 36, 0.6);
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed #d4af37;
        }
        .visit-count-number {
            font-weight: bold;
            color: #ffd700;
        }

        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffd700;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            background-color: #041a10;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }
        select:focus, input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }
        .word-config-box {
            background: #052617;
            border: 1px solid #d4af37;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .word-row {
            margin-bottom: 12px;
        }
        .word-row:last-child {
            margin-bottom: 0;
        }

        /* Tombol 3D Emas Batangan (Gold Bar) */
        .btn-gold-3d {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #ffe680;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #2b1a00;
            background: linear-gradient(180deg, #ffe57f 0%, #d4af37 45%, #aa771c 80%, #7a520c 100%);
            box-shadow: 0 5px 0 #4a3206, 0 8px 15px rgba(0, 0, 0, 0.6);
            position: relative;
            transition: all 0.1s ease;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        .btn-gold-3d:hover {
            background: linear-gradient(180deg, #fff0b3 0%, #e6c200 45%, #c48b21 80%, #8c5e0e 100%);
            box-shadow: 0 6px 0 #4a3206, 0 10px 18px rgba(212, 175, 55, 0.4);
        }
        .btn-gold-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #4a3206, 0 3px 6px rgba(0, 0, 0, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .results-container {
            margin-top: 30px;
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 18px;
            background: #041a10;
            max-height: 450px;
            overflow-y: auto;
        }
        .result-item {
            background: #0a2d1c;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 5px solid #ffd700;
            border-top: 1px solid #134e35;
            border-right: 1px solid #134e35;
            border-bottom: 1px solid #134e35;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .name-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }
        .name-meaning {
            font-size: 14px;
            color: #d0e3d8;
            margin-top: 5px;
            font-style: italic;
        }
        .error-msg {
            color: #ff6b6b;
            text-align: center;
            padding: 10px;
        }

        /* Responsive & Print Styling */
        @media print {
            body { background: #ffffff; color: #000000; padding: 0; }
            .container { box-shadow: none; border: none; max-width: 100%; width: 100%; padding: 0; background: #ffffff; }
            .form-group, .word-config-box, .btn-group, .btn-gold-3d, .visit-counter { display: none !important; }
            .results-container { max-height: none; overflow: visible; border: none; padding: 0; background: #ffffff; }
            .result-item { background: #ffffff; border-left: 4px solid #000; border-top: 1px solid #ccc; border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; page-break-inside: avoid; }
            .name-title { color: #000000; }
            .name-meaning { color: #333333; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; color: #000; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="print-header">
        <h1>Daftar Rekomendasi Nama Bayi</h1>
        <p style="font-size: 12px; margin-top: 4px;">Developer: fatur62</p>
        <hr style="margin-top: 10px; border: 1px solid #000;">
    </div>

    <div class="header-section">
        <h2>Generator Nama Bayi</h2>
        <div class="developer-tag">
            <span class="blinking-dot"></span>
            <span>developer : fatur62</span>
        </div>
    </div>

    <!-- Live Visit Counter -->
    <div class="visit-counter">
        Total Kunjungan Aplikasi: <span class="visit-count-number" id="visitCount">Memuat...</span> kali
    </div>

    <!-- 1. Jenis Kelamin -->
    <div class="form-group">
        <label for="genderSelect">1. Jenis Kelamin:</label>
        <select id="genderSelect">
            <option value="P">Perempuan (P)</option>
            <option value="L">Laki-laki (L)</option>
        </select>
    </div>

    <!-- 2. Jumlah Kata -->
    <div class="form-group">
        <label for="wordCountSelect">2. Jumlah Kata Nama:</label>
        <select id="wordCountSelect">
            <option value="1">1 Kata</option>
            <option value="2">2 Kata</option>
            <option value="3" selected>3 Kata</option>
        </select>
    </div>

    <!-- 3. Pilihan Bahasa per Kata -->
    <div class="word-config-box">
        <label>3. Pilihan Bahasa per Kata:</label>
        <div id="wordLanguagesContainer"></div>
    </div>

    <!-- 4. Jumlah Generate -->
    <div class="form-group">
        <label for="limitInput">4. Jumlah Nama (Maks. 200):</label>
        <input type="number" id="limitInput" value="10" min="1" max="200">
    </div>

    <button id="generateBtn" class="btn-gold-3d">Generate Kombinasi Nama</button>

    <!-- Output Hasil & Tombol Aksi -->
    <div class="results-container" id="resultsContainer" style="display: none;">
        <div class="btn-group" style="margin-bottom: 15px; margin-top: 0;">
            <button id="printBtn" class="btn-gold-3d" style="font-size: 14px; padding: 10px;">Cetak Hasil</button>
            <button id="pdfBtn" class="btn-gold-3d" style="font-size: 14px; padding: 10px;">Simpan PDF</button>
        </div>
        <div id="resultsList"></div>
    </div>
</div>

<script>
    let vocabData = null;

    // Real-Time Hitungan Kunjungan via CountAPI
    async function updateVisitCount() {
        const visitCountEl = document.getElementById('visitCount');
        try {
            // Menggunakan namespace unik 'generate-nama-bayi-fatur62'
            const res = await fetch('https://api.countapi.xyz/hit/generate-nama-bayi-fatur62/visits');
            if (res.ok) {
                const data = await res.json();
                visitCountEl.textContent = data.value.toLocaleString('id-ID');
            } else {
                visitCountEl.textContent = "1+";
            }
        } catch (err) {
            console.error("Gagal memperbarui hitungan kunjungan:", err);
            visitCountEl.textContent = "Offline";
        }
    }

    async function loadVocabData() {
        try {
            const response = await fetch('vocab.json');
            if (!response.ok) {
                throw new Error(`HTTP Error: ${response.status}`);
            }
            vocabData = await response.json();
        } catch (error) {
            console.error("Gagal memuat vocab.json:", error);
            alert("Gagal memuat file data vocab.json. Pastikan file tersedia.");
        }
    }

    function renderWordLanguageOptions(count) {
        const container = document.getElementById('wordLanguagesContainer');
        container.innerHTML = '';

        for (let i = 1; i <= count; i++) {
            const row = document.createElement('div');
            row.className = 'word-row';
            row.innerHTML = `
                <label style="font-weight: normal; font-size: 13px; color: #d0e3d8;">Bahasa Kata ke-${i}:</label>
                <select class="word-lang-select" data-word-index="${i}">
                    <option value="arab">Bahasa Arab</option>
                    <option value="jawa">Bahasa Jawa / Indonesia</option>
                    <option value="inggris">Bahasa Inggris</option>
                    <option value="yunani_eropa">Bahasa Yunani & Eropa</option>
                    <option value="unisex">Unisex (Umum)</option>
                </select>
            `;
            container.appendChild(row);
        }
    }

    function getWordList(lang, gender) {
        if (!vocabData) return [];
        if (lang === 'unisex') {
            return vocabData.unisex || [];
        }
        if (vocabData[lang] && vocabData[lang][gender]) {
            return vocabData[lang][gender];
        }
        return [];
    }

    function getRandomElement(arr) {
        if (!Array.isArray(arr) || arr.length === 0) return null;
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateNames() {
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        resultsList.innerHTML = '';

        if (!vocabData) {
            resultsList.innerHTML = '<div class="error-msg">Data kata belum dimuat dengan benar.</div>';
            resultsContainer.style.display = 'block';
            return;
        }

        const gender = document.getElementById('genderSelect').value;
        const wordCount = parseInt(document.getElementById('wordCountSelect').value, 10);
        
        let limit = parseInt(document.getElementById('limitInput').value, 10);
        if (isNaN(limit) || limit < 1) limit = 1;
        limit = Math.min(limit, 200);

        const langSelects = document.querySelectorAll('.word-lang-select');
        const selectedLanguages = Array.from(langSelects).map(select => select.value);

        const wordPools = selectedLanguages.map(lang => getWordList(lang, gender));

        for (let i = 0; i < wordPools.length; i++) {
            if (wordPools[i].length === 0) {
                resultsList.innerHTML = `<div class="error-msg">Data nama untuk kata ke-${i + 1} (${selectedLanguages[i]}) tidak ditemukan!</div>`;
                resultsContainer.style.display = 'block';
                return;
            }
        }

        const generatedSet = new Set();
        const results = [];
        let attempts = 0;
        const maxAttempts = limit * 15;

        while (results.length < limit && attempts < maxAttempts) {
            attempts++;
            let nameParts = [];
            let meaningParts = [];

            for (let i = 0; i < wordCount; i++) {
                const item = getRandomElement(wordPools[i]);
                if (item) {
                    nameParts.push(item.name || '');
                    meaningParts.push(item.meaning || '');
                }
            }

            const fullName = nameParts.join(' ').trim();
            const fullMeaning = meaningParts.join('; ').trim();

            if (fullName && !generatedSet.has(fullName)) {
                generatedSet.add(fullName);
                results.push({ name: fullName, meaning: fullMeaning });
            }
        }

        if (results.length === 0) {
            resultsList.innerHTML = '<div class="error-msg">Gagal mengenerate kombinasi nama.</div>';
        } else {
            results.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'result-item';
                itemEl.innerHTML = `
                    <div class="name-title">${index + 1}. ${item.name}</div>
                    <div class="name-meaning">${item.meaning ? `"${item.meaning}"` : '-'}</div>
                `;
                resultsList.appendChild(itemEl);
            });
        }

        resultsContainer.style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadVocabData();
        updateVisitCount();

        const wordCountSelect = document.getElementById('wordCountSelect');
        const generateBtn = document.getElementById('generateBtn');
        const printBtn = document.getElementById('printBtn');
        const pdfBtn = document.getElementById('pdfBtn');

        renderWordLanguageOptions(parseInt(wordCountSelect.value, 10));

        wordCountSelect.addEventListener('change', (e) => {
            renderWordLanguageOptions(parseInt(e.target.value, 10));
        });

        generateBtn.addEventListener('click', generateNames);

        printBtn.addEventListener('click', () => {
            window.print();
        });

        pdfBtn.addEventListener('click', () => {
            window.print();
        });
    });
</script>

</body>
</html>
