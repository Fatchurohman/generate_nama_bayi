<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumpulan Nama Baik - Royal Emerald & Glorious Gold</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #163B2A 0%, #0B1D15 70%, #050E0A 100%);
      --card-bg: rgba(16, 42, 30, 0.85);
      --input-bg: #091711;
      --gold-primary: #F3C649;
      --gold-dark: #B8860B;
      --gold-light: #FFE89C;
      --gold-gradient: linear-gradient(135deg, #FFF0B3 0%, #F3C649 40%, #B8860B 80%, #7A5800 100%);
      --gold-soft-bg: rgba(243, 198, 73, 0.1);
      --text-main: #F4F6F0;
      --text-muted: #A3B899;
      --text-gold: #FCE182;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto 30px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(243, 198, 73, 0.3);
      padding-bottom: 15px;
    }

    .app-title h1 {
      font-size: 24px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 10px rgba(243, 198, 73, 0.2);
    }

    .app-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .developer-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(9, 23, 17, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--gold-primary);
      box-shadow: 0 0 12px rgba(243, 198, 73, 0.25);
      font-size: 13px;
      font-weight: 600;
      color: var(--gold-light);
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.8); }
      70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .main-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .filter-card {
      background: var(--card-bg);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 15px rgba(243, 198, 73, 0.15);
      margin-bottom: 25px;
      backdrop-filter: blur(10px);
    }

    .filter-group {
      margin-bottom: 18px;
    }

    .filter-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-gold);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    select, input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--gold-dark);
      border-radius: 6px;
      background-color: var(--input-bg);
      color: var(--text-main);
      outline: none;
      font-size: 14px;
    }

    select:focus, input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 8px rgba(243, 198, 73, 0.5);
    }

    .lang-position-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #0B1D15;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(243, 198, 73, 0.3);
    }

    .btn-gold:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(243, 198, 73, 0.5);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
    }

    .btn-outline:hover {
      background: var(--gold-soft-bg);
      box-shadow: 0 0 10px rgba(243, 198, 73, 0.2);
    }

    .results-info {
      margin-bottom: 15px;
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .name-card {
      background: var(--card-bg);
      border: 1px solid rgba(243, 198, 73, 0.4);
      border-radius: 10px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }

    .name-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--gold-gradient);
    }

    .name-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-primary);
      box-shadow: 0 6px 20px rgba(243, 198, 73, 0.3);
      background: rgba(22, 59, 42, 0.95);
    }

    .name-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .name-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0B1D15;
      border: 2px solid var(--gold-primary);
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(243, 198, 73, 0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px; right: 15px;
      background: none; border: none;
      font-size: 24px; color: var(--gold-light);
      cursor: pointer;
    }

    .modal-title {
      font-size: 22px;
      color: var(--gold-light);
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(243, 198, 73, 0.3);
      padding-bottom: 10px;
      font-weight: 700;
    }

    .word-breakdown {
      margin-bottom: 15px;
    }

    .word-item {
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-main);
    }

    .word-item strong {
      color: var(--gold-primary);
    }

    .full-meaning {
      background: var(--gold-soft-bg);
      padding: 14px;
      border-radius: 6px;
      border-left: 3px solid var(--gold-primary);
      font-size: 14px;
      font-style: italic;
      color: var(--gold-light);
      line-height: 1.5;
    }

    @media print {
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        padding: 0;
      }
      .filter-card, .action-buttons, .developer-badge, .modal-overlay {
        display: none !important;
      }
      .header-container {
        border-bottom: 1px solid #000;
        margin-bottom: 20px;
      }
      .app-title h1 {
        -webkit-text-fill-color: #000 !important;
        color: #000 !important;
      }
      .name-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .name-card {
        background: #FFF !important;
        border: 1px solid #ccc !important;
        break-inside: avoid;
      }
      .name-title { color: #000 !important; }
      .name-subtitle { color: #555 !important; }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="app-title">
      <h1>Kumpulan Nama Baik</h1>
      <p>Pilihan Nama Berkah & Indah untuk Sang Buah Hati</p>
    </div>
    <div class="developer-badge">
      <span class="live-dot"></span>
      <span>developer : fatur62</span>
    </div>
  </div>

  <div class="main-container">
    <div class="filter-card">
      <div class="filter-group">
        <label for="genderSelect">1. Jenis Kelamin</label>
        <select id="genderSelect">
          <option value="Semua" selected>Semua (Laki-laki & Perempuan)</option>
          <option value="L">Laki-laki</option>
          <option value="P">Perempuan</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="wordCount">2. Jumlah Kata (1 - 4 Kata)</label>
        <select id="wordCount" onchange="renderLanguageFilters()">
          <option value="1">1 Kata</option>
          <option value="2" selected>2 Kata</option>
          <option value="3">3 Kata</option>
          <option value="4">4 Kata</option>
        </select>
      </div>

      <div class="filter-group">
        <label>3. Kombinasi Bahasa per Posisi Kata</label>
        <div id="languageFilters" class="lang-position-grid"></div>
      </div>

      <div class="filter-group">
        <label for="limitCount">4. Maksimal Alternatif Ditampilkan (Maks. 1000)</label>
        <input type="number" id="limitCount" min="1" max="1000" value="50">
      </div>

      <div class="action-buttons">
        <button class="btn btn-gold" onclick="applyFilters()">Tampilkan Nama</button>
        <button class="btn btn-outline" onclick="window.print()">Cetak / Simpan PDF</button>
      </div>
    </div>

    <div class="results-info">
      <span id="resultCountText">Memuat data kosakata...</span>
    </div>

    <div id="nameGrid" class="name-grid"></div>
  </div>

  <div id="detailModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-title" id="modalName">Nama Lengkap</div>
      <div class="word-breakdown" id="modalBreakdown"></div>
      <div class="full-meaning" id="modalMeaning">Makna dan Doa...</div>
    </div>
  </div>

  <script>
    let vocabData = null;
    const availableLanguages = ["Semua", "Arab", "Inggris", "Italia", "Yunani", "Indonesia", "Prancis"];
    const selectableLanguages = ["Arab", "Inggris", "Italia", "Yunani", "Indonesia", "Prancis"];

    async function loadVocabJSON() {
      try {
        const response = await fetch('vocab.json');
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (!data || typeof data !== 'object' || !data.baseVocab || typeof data.baseVocab !== 'object') {
          throw new Error("Format JSON tidak valid atau struktur data tidak sesuai.");
        }

        vocabData = data;
        renderLanguageFilters();
        applyFilters();
      } catch (error) {
        console.error("Gagal memuat JSON:", error);
        document.getElementById('resultCountText').innerText = "Gagal memuat data kosakata. Pastikan file vocab.json tersedia dan valid.";
      }
    }

    function renderLanguageFilters() {
      const count = parseInt(document.getElementById('wordCount').value, 10) || 2;
      const container = document.getElementById('languageFilters');
      if (!container) return;
      
      container.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        const div = document.createElement('div');
        div.innerHTML = `
          <span style="font-size:12px; color: var(--text-muted);">Kata ke-${i}:</span>
          <select id="langPos_${i}">
            ${availableLanguages.map(lang => `<option value="${lang}">${lang}</option>`).join('')}
          </select>
        `;
        container.appendChild(div);
      }
    }

    function shuffleArray(array) {
      if (!Array.isArray(array)) return [];
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateNamesFromVocab(selectedGender, targetWordCount, selectedLangs, limitCount) {
      if (!vocabData || !vocabData.baseVocab) return [];

      const results = [];
      const usedFullNames = new Set();
      const baseVocab = vocabData.baseVocab;
      const modifiers = Array.isArray(vocabData.modifiers) ? vocabData.modifiers : [];

      let safetyAttempts = 0;
      const maxAttempts = limitCount * 20;

      while (results.length < limitCount && safetyAttempts < maxAttempts) {
        safetyAttempts++;
        const currentCombo = [];
        const usedWordsInSingleName = new Set();

        let isValidCombo = true;

        for (let pos = 0; pos < targetWordCount; pos++) {
          const langReq = selectedLangs[pos] || "Semua";
          const activeLang = (langReq === "Semua") 
            ? selectableLanguages[Math.floor(Math.random() * selectableLanguages.length)]
            : langReq;

          const rawList = baseVocab[activeLang];
          if (!Array.isArray(rawList) || rawList.length === 0) {
            isValidCombo = false;
            break;
          }
          
          // Filter berdasarkan gender
          const filteredList = rawList.filter(item => {
            if (!item || !item.text) return false;
            const itemGender = item.gender || "U";
            return selectedGender === "Semua" || itemGender === "U" || itemGender === selectedGender;
          });

          if (filteredList.length === 0) {
            isValidCombo = false;
            break;
          }

          let baseObj = null;
          const shuffledList = shuffleArray(filteredList);
          
          for (const candidate of shuffledList) {
            if (candidate && candidate.text && !usedWordsInSingleName.has(candidate.text.toLowerCase())) {
              baseObj = candidate;
              break;
            }
          }

          if (!baseObj) {
            isValidCombo = false;
            break;
          }

          usedWordsInSingleName.add(baseObj.text.toLowerCase());

          // Filter modifier yang cocok dengan bahasa dan gender
          const validModifiers = modifiers.filter(m => {
            const langMatch = !m.lang || m.lang === "all" || m.lang === activeLang;
            const genderMatch = !m.gender || m.gender === "U" || selectedGender === "Semua" || m.gender === selectedGender;
            return langMatch && genderMatch;
          });

          const modObj = validModifiers.length > 0 
            ? validModifiers[Math.floor(Math.random() * validModifiers.length)]
            : { prefix: "", suffix: "", meaningAdd: "" };

          let baseText = baseObj.text || "";
          const prefix = modObj.prefix || "";
          const suffix = modObj.suffix || "";

          // Penyesuaian tata bahasa: Jika kata berakhiran 'ah' (misal: Rahmah) ketemu suffix 'atul', diubah jadi 'Rahmatul'
          if (suffix === "atul" && baseText.toLowerCase().endsWith("ah")) {
            baseText = baseText.slice(0, -2) + "t";
          }

          const wordText = `${prefix}${baseText}${suffix}`;
          const meaningAdd = modObj.meaningAdd ? ` (${modObj.meaningAdd})` : "";
          const meaningText = `${baseObj.meaning || ''}${meaningAdd}`;

          currentCombo.push({
            text: wordText,
            meaning: meaningText,
            lang: activeLang
          });
        }

        if (isValidCombo && currentCombo.length === targetWordCount) {
          const fullName = currentCombo.map(w => w.text).join(' ');
          const fullNameKey = fullName.toLowerCase();

          if (!usedFullNames.has(fullNameKey)) {
            usedFullNames.add(fullNameKey);
            const meaningsStr = currentCombo.map(w => w.meaning.toLowerCase()).join(', ');

            results.push({
              id: Date.now() + Math.random(),
              fullName: fullName,
              wordsCount: targetWordCount,
              words: currentCombo,
              fullMeaning: `Sosok yang membawakan harapan (${meaningsStr}), menjadi doa kebaikan bagi kehidupannya.`
            });
          }
        }
      }

      return results;
    }

    function applyFilters() {
      if (!vocabData) return;

      const selectedGender = document.getElementById('genderSelect').value || "Semua";
      const targetWordCount = parseInt(document.getElementById('wordCount').value, 10) || 2;
      const limitInput = parseInt(document.getElementById('limitCount').value, 10);
      const limitCount = isNaN(limitInput) || limitInput < 1 ? 50 : Math.min(limitInput, 1000);
      
      const selectedLangs = [];
      for (let i = 1; i <= targetWordCount; i++) {
        const select = document.getElementById(`langPos_${i}`);
        selectedLangs.push(select ? select.value : "Semua");
      }

      const generatedData = generateNamesFromVocab(selectedGender, targetWordCount, selectedLangs, limitCount);
      renderResults(generatedData);
    }

    function renderResults(data) {
      const grid = document.getElementById('nameGrid');
      const countText = document.getElementById('resultCountText');
      if (!grid || !countText) return;

      grid.innerHTML = '';
      countText.innerText = `Menampilkan ${data.length} alternatif nama`;

      if (!Array.isArray(data) || data.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color: var(--text-muted); padding:30px;">Tidak ada kombinasi nama yang cocok.</div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'name-card';
        card.onclick = () => openModal(item);

        const langsText = (item.words || []).map(w => w.lang).join(' + ');

        card.innerHTML = `
          <div class="name-title">${escapeHtml(item.fullName || '')}</div>
          <div class="name-subtitle">Kombinasi: ${escapeHtml(langsText)}</div>
        `;
        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
    }

    function openModal(item) {
      if (!item) return;

      const modalName = document.getElementById('modalName');
      const breakdownContainer = document.getElementById('modalBreakdown');
      const modalMeaning = document.getElementById('modalMeaning');
      const detailModal = document.getElementById('detailModal');

      if (modalName) modalName.innerText = item.fullName || '';
      if (breakdownContainer) {
        breakdownContainer.innerHTML = '';
        if (Array.isArray(item.words)) {
          item.words.forEach((w, index) => {
            const div = document.createElement('div');
            div.className = 'word-item';
            div.innerHTML = `Kata ${index + 1} (<strong>${escapeHtml(w.lang || '')}</strong>): <em>"${escapeHtml(w.text || '')}"</em> - ${escapeHtml(w.meaning || '')}`;
            breakdownContainer.appendChild(div);
          });
        }
      }

      if (modalMeaning) modalMeaning.innerText = `Doa & Harapan: "${item.fullMeaning || '-'}"`;
      if (detailModal) detailModal.classList.add('active');
    }

    function closeModal() {
      const detailModal = document.getElementById('detailModal');
      if (detailModal) detailModal.classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target && e.target.id === 'detailModal') {
        closeModal();
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener('DOMContentLoaded', loadVocabJSON);
  </script>
</body>
</html>
