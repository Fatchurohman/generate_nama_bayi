<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Nama Bayi & Makna</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }
        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            outline: none;
        }
        select:focus {
            border-color: #4CAF50;
        }
        button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #eef7ee;
            border-left: 5px solid #4CAF50;
            border-radius: 4px;
            text-align: center;
        }
        .result-name {
            font-size: 22px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 5px;
        }
        .result-meaning {
            font-size: 15px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Generator Nama</h2>
    
    <div class="form-group">
        <label for="languageSelect">Pilih Bahasa/Kategori:</label>
        <select id="languageSelect">
            <option value="arab">Bahasa Arab</option>
            <option value="jawa">Bahasa Jawa / Indonesia</option>
            <option value="inggris">Bahasa Inggris</option>
            <option value="yunani_eropa">Bahasa Yunani & Eropa</option>
            <option value="unisex">Unisex (Umum)</option>
        </select>
    </div>

    <div class="form-group" id="genderGroup">
        <label for="genderSelect">Pilih Jenis Kelamin:</label>
        <select id="genderSelect">
            <option value="P">Perempuan (P)</option>
            <option value="L">Laki-laki (L)</option>
        </select>
    </div>

    <button id="generateBtn">Generate Nama</button>

    <div class="result-box" id="resultBox" style="display: none;">
        <div class="result-name" id="resultName">-</div>
        <div class="result-meaning" id="resultMeaning">-</div>
    </div>
</div>

<script>
    let vocabData = null;

    // Fetch data JSON saat pertama kali dimuat
    async function loadVocabData() {
        try {
            const response = await fetch('vocab.json');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            vocabData = await response.json();
        } catch (error) {
            console.error('Gagal memuat file vocab.json:', error);
            alert('Gagal memuat data nama. Pastikan file vocab.json tersedia!');
        }
    }

    // Fungsi utama pencarian/pengacakan nama
    function generateName(selectedLanguage, selectedGender) {
        if (!vocabData) {
            return { name: "Data belum siap", meaning: "Silakan coba lagi" };
        }

        let nameList = [];

        try {
            if (selectedLanguage === 'unisex') {
                nameList = vocabData.unisex || [];
            } else if (vocabData[selectedLanguage] && vocabData[selectedLanguage][selectedGender]) {
                nameList = vocabData[selectedLanguage][selectedGender];
            }

            if (!Array.isArray(nameList) || nameList.length === 0) {
                return { name: "Nama tidak ditemukan", meaning: "Pilihan kategori tidak memiliki data" };
            }

            const randomIndex = Math.floor(Math.random() * nameList.length);
            return nameList[randomIndex] || { name: "Nama tidak valid", meaning: "-" };

        } catch (error) {
            console.error("Error generating name:", error);
            return { name: "Terjadi kesalahan", meaning: "Gagal memproses data" };
        }
    }

    // Event Listener DOM
    document.addEventListener('DOMContentLoaded', () => {
        loadVocabData();

        const languageSelect = document.getElementById('languageSelect');
        const genderGroup = document.getElementById('genderGroup');
        const generateBtn = document.getElementById('generateBtn');
        const resultBox = document.getElementById('resultBox');
        const resultName = document.getElementById('resultName');
        const resultMeaning = document.getElementById('resultMeaning');

        // Sembunyikan opsi gender jika kategori Unisex dipilih
        languageSelect.addEventListener('change', () => {
            if (languageSelect.value === 'unisex') {
                genderGroup.style.display = 'none';
            } else {
                genderGroup.style.display = 'block';
            }
        });

        // Event Klik Tombol Generate
        generateBtn.addEventListener('click', () => {
            const lang = languageSelect.value;
            const gender = document.getElementById('genderSelect').value;

            const result = generateName(lang, gender);

            resultName.textContent = result.name || "-";
            resultMeaning.textContent = result.meaning ? `"${result.meaning}"` : "-";
            resultBox.style.display = 'block';
        });
    });
</script>

</body>
</html>
