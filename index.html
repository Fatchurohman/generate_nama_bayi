<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Nama Bayi - Glorious Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', 'Segoe UI', serif;
        }
        body {
            background: linear-gradient(135deg, #072215 0%, #0b3b24 50%, #051a10 100%);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #222;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 680px;
            padding: 35px;
            border-radius: 16px;
            border: 2px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
            position: relative;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0b3b24;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #0b3b24, #1a5c3d, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #0b3b24;
            font-size: 15px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            background-color: #fcfbf7;
            font-size: 15px;
            color: #1a1a1a;
            outline: none;
            transition: all 0.3s ease;
        }
        select:focus, input:focus {
            border-color: #aa771c;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }
        .word-config-box {
            background: #f4f8f5;
            border: 1px solid #c2a34b;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .word-row {
            margin-bottom: 12px;
        }
        .word-row:last-child {
            margin-bottom: 0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-generate {
            background: linear-gradient(135deg, #d4af37 0%, #ffd700 50%, #aa771c 100%);
            color: #0b3b24;
            box-shadow: 0 4px 12px rgba(170, 119, 28, 0.3);
        }
        .btn-generate:hover {
            background: linear-gradient(135deg, #aa771c 0%, #d4af37 50%, #ffd700 100%);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.5);
        }
        .btn-action {
            background: #0b3b24;
            color: #ffd700;
            border: 1px solid #d4af37;
        }
        .btn-action:hover {
            background: #134e35;
            color: #ffffff;
        }
        .results-container {
            margin-top: 30px;
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            background: #fdfdfa;
            max-height: 450px;
            overflow-y: auto;
        }
        .result-item {
            background: #ffffff;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 5px solid #0b3b24;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border-right: 1px solid #eee;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .name-title {
            font-size: 18px;
            font-weight: bold;
            color: #0b3b24;
        }
        .name-meaning {
            font-size: 14px;
            color: #555;
            margin-top: 5px;
            font-style: italic;
        }
        .error-msg {
            color: #c53030;
            text-align: center;
            padding: 10px;
        }

        /* Styling Khusus Cetak & Simpan PDF */
        @media print {
            body {
                background: none;
                color: #000;
                padding: 0;
            }
            .container {
                box-shadow: none;
                border: none;
                max-width: 100%;
                width: 100%;
                padding: 0;
            }
            .form-group, .word-config-box, .btn-group, #generateBtn, h2 {
                display: none !important;
            }
            .results-container {
                max-height: none;
                overflow: visible;
                border: none;
                padding: 0;
            }
            .print-header {
                display: block !important;
                text-align: center;
                margin-bottom: 20px;
            }
            .print-header h1 {
                color: #0b3b24;
                font-size: 24px;
            }
            .result-item {
                border-left: 3px solid #0b3b24;
                page-break-inside: avoid;
            }
        }
        .print-header {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="print-header">
        <h1>Daftar Rekomendasi Nama Bayi</h1>
        <hr style="margin-top: 10px; border: 1px solid #d4af37;">
    </div>

    <h2>Generator Nama Bayi</h2>

    <!-- 1. Jenis Kelamin -->
    <div class="form-group">
        <label for="genderSelect">1. Jenis Kelamin:</label>
        <select id="genderSelect">
            <option value="P">Perempuan (P)</option>
            <option value="L">Laki-laki (L)</option>
        </select>
    </div>

    <!-- 2. Jumlah Kata -->
    <div class="form-group">
        <label for="wordCountSelect">2. Jumlah Kata Nama:</label>
        <select id="wordCountSelect">
            <option value="1">1 Kata</option>
            <option value="2">2 Kata</option>
            <option value="3" selected>3 Kata</option>
        </select>
    </div>

    <!-- 3. Pilihan Bahasa per Kata -->
    <div class="word-config-box">
        <label>3. Pilihan Bahasa per Kata:</label>
        <div id="wordLanguagesContainer"></div>
    </div>

    <!-- 4. Jumlah Generate -->
    <div class="form-group">
        <label for="limitInput">4. Jumlah Nama (Maks. 200):</label>
        <input type="number" id="limitInput" value="10" min="1" max="200">
    </div>

    <button id="generateBtn" class="btn-generate">Generate Kombinasi Nama</button>

    <!-- Output Hasil & Aksi Cetak/PDF -->
    <div class="results-container" id="resultsContainer" style="display: none;">
        <div class="btn-group" style="margin-bottom: 15px; margin-top: 0;">
            <button id="printBtn" class="btn-action">Cetak Hasil</button>
            <button id="pdfBtn" class="btn-action">Simpan PDF</button>
        </div>
        <div id="resultsList"></div>
    </div>
</div>

<script>
    let vocabData = null;

    async function loadVocabData() {
        try {
            const response = await fetch('vocab.json');
            if (!response.ok) {
                throw new Error(`HTTP Error: ${response.status}`);
            }
            vocabData = await response.json();
        } catch (error) {
            console.error("Gagal memuat vocab.json:", error);
            alert("Gagal memuat file data vocab.json. Pastikan file tersedia.");
        }
    }

    function renderWordLanguageOptions(count) {
        const container = document.getElementById('wordLanguagesContainer');
        container.innerHTML = '';

        for (let i = 1; i <= count; i++) {
            const row = document.createElement('div');
            row.className = 'word-row';
            row.innerHTML = `
                <label style="font-weight: normal; font-size: 14px;">Bahasa Kata ke-${i}:</label>
                <select class="word-lang-select" data-word-index="${i}">
                    <option value="arab">Bahasa Arab</option>
                    <option value="jawa">Bahasa Jawa / Indonesia</option>
                    <option value="inggris">Bahasa Inggris</option>
                    <option value="yunani_eropa">Bahasa Yunani & Eropa</option>
                    <option value="unisex">Unisex (Umum)</option>
                </select>
            `;
            container.appendChild(row);
        }
    }

    function getWordList(lang, gender) {
        if (!vocabData) return [];
        if (lang === 'unisex') {
            return vocabData.unisex || [];
        }
        if (vocabData[lang] && vocabData[lang][gender]) {
            return vocabData[lang][gender];
        }
        return [];
    }

    function getRandomElement(arr) {
        if (!Array.isArray(arr) || arr.length === 0) return null;
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateNames() {
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        resultsList.innerHTML = '';

        if (!vocabData) {
            resultsList.innerHTML = '<div class="error-msg">Data kata belum dimuat dengan benar.</div>';
            resultsContainer.style.display = 'block';
            return;
        }

        const gender = document.getElementById('genderSelect').value;
        const wordCount = parseInt(document.getElementById('wordCountSelect').value, 10);
        
        let limit = parseInt(document.getElementById('limitInput').value, 10);
        if (isNaN(limit) || limit < 1) limit = 1;
        limit = Math.min(limit, 200);

        const langSelects = document.querySelectorAll('.word-lang-select');
        const selectedLanguages = Array.from(langSelects).map(select => select.value);

        const wordPools = selectedLanguages.map(lang => getWordList(lang, gender));

        for (let i = 0; i < wordPools.length; i++) {
            if (wordPools[i].length === 0) {
                resultsList.innerHTML = `<div class="error-msg">Data nama untuk kata ke-${i + 1} (${selectedLanguages[i]}) tidak ditemukan!</div>`;
                resultsContainer.style.display = 'block';
                return;
            }
        }

        const generatedSet = new Set();
        const results = [];
        let attempts = 0;
        const maxAttempts = limit * 15;

        while (results.length < limit && attempts < maxAttempts) {
            attempts++;
            let nameParts = [];
            let meaningParts = [];

            for (let i = 0; i < wordCount; i++) {
                const item = getRandomElement(wordPools[i]);
                if (item) {
                    nameParts.push(item.name || '');
                    meaningParts.push(item.meaning || '');
                }
            }

            const fullName = nameParts.join(' ').trim();
            const fullMeaning = meaningParts.join('; ').trim();

            if (fullName && !generatedSet.has(fullName)) {
                generatedSet.add(fullName);
                results.push({ name: fullName, meaning: fullMeaning });
            }
        }

        if (results.length === 0) {
            resultsList.innerHTML = '<div class="error-msg">Gagal mengenerate kombinasi nama.</div>';
        } else {
            results.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'result-item';
                itemEl.innerHTML = `
                    <div class="name-title">${index + 1}. ${item.name}</div>
                    <div class="name-meaning">${item.meaning ? `"${item.meaning}"` : '-'}</div>
                `;
                resultsList.appendChild(itemEl);
            });
        }

        resultsContainer.style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadVocabData();

        const wordCountSelect = document.getElementById('wordCountSelect');
        const generateBtn = document.getElementById('generateBtn');
        const printBtn = document.getElementById('printBtn');
        const pdfBtn = document.getElementById('pdfBtn');

        renderWordLanguageOptions(parseInt(wordCountSelect.value, 10));

        wordCountSelect.addEventListener('change', (e) => {
            renderWordLanguageOptions(parseInt(e.target.value, 10));
        });

        generateBtn.addEventListener('click', generateNames);

        // Fungsi Cetak / Simpan PDF
        printBtn.addEventListener('click', () => {
            window.print();
        });

        pdfBtn.addEventListener('click', () => {
            window.print(); // Membuka dialog print bawaan browser yang menyediakan opsi 'Save as PDF'
        });
    });
</script>

</body>
</html>
